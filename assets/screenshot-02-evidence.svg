<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Placeholder screenshot: floorboards covered in a bloody drag-mark, a smeared handprint, scattered feathers and the words GET OUT scratched into the wood.">
