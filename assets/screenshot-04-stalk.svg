<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Placeholder screenshot: a spiral stairwell seen from above with a lone figure descending, lit by weak red emergency light.">
  <defs>
    <linearGradient id="s4bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120e0f"/>
      <stop offset="1" stop-color="#060405"/>
    </linearGradient>
    <radialGradient id="s4core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c1121f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c1121f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s4vig" cx=".5" cy=".5" r=".7">
      <stop offset=".34" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".94"/>
    </radialGradient>
    <filter id="s4noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="s4soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
    <path id="s4wedge" d="M0 0 L0 -360 A360 360 0 0 1 186 -308 Z"/>
  </defs>

  <rect width="1600" height="900" fill="url(#s4bg)"/>

  <g transform="translate(800 450)">
    <circle r="392" fill="#0b0809" stroke="#1c1516" stroke-width="6"/>

    <!-- steps, alternating tone -->
    <g stroke="#0a0708" stroke-width="4">
      <use href="#s4wedge" fill="#171213" transform="rotate(0)"/>
      <use href="#s4wedge" fill="#120e0f" transform="rotate(30)"/>
      <use href="#s4wedge" fill="#171213" transform="rotate(60)"/>
      <use href="#s4wedge" fill="#120e0f" transform="rotate(90)"/>
      <use href="#s4wedge" fill="#171213" transform="rotate(120)"/>
      <use href="#s4wedge" fill="#120e0f" transform="rotate(150)"/>
      <use href="#s4wedge" fill="#171213" transform="rotate(180)"/>
      <use href="#s4wedge" fill="#120e0f" transform="rotate(210)"/>
      <use href="#s4wedge" fill="#171213" transform="rotate(240)"/>
      <use href="#s4wedge" fill="#120e0f" transform="rotate(270)"/>
      <use href="#s4wedge" fill="#171213" transform="rotate(300)"/>
      <use href="#s4wedge" fill="#120e0f" transform="rotate(330)"/>
    </g>

    <!-- central void -->
    <circle r="104" fill="#040303"/>
    <circle r="104" fill="url(#s4core)"/>
    <circle r="104" fill="none" stroke="#2a1e20" stroke-width="6"/>

    <!-- handrail spiral -->
    <circle r="352" fill="none" stroke="#2e2426" stroke-width="10" opacity=".9"/>
    <circle r="238" fill="none" stroke="#2e2426" stroke-width="8" opacity=".7"/>
    <circle r="140" fill="none" stroke="#2e2426" stroke-width="6" opacity=".55"/>

    <!-- lone figure on the stairs -->
    <g transform="rotate(66) translate(0 -286)">
      <circle cy="-70" r="30" fill="#050303"/>
      <path d="M-52 74c0-96 20-134 52-140 32 6 52 44 52 140z" fill="#050303"/>
      <path d="M40 -20l70 46" stroke="#050303" stroke-width="24" stroke-linecap="round"/>
      <path d="M104 30l54 36" stroke="#ffe9b0" stroke-width="8" stroke-linecap="round" opacity=".85"/>
      <path d="M118 40l182 120" fill="#ffb703" opacity=".14"/>
    </g>

    <!-- blood drip down the inner wall -->
    <path d="M-60 -100c4 40 2 78-6 116" stroke="#8f0d17" stroke-width="10" stroke-linecap="round" fill="none" opacity=".8"/>
    <circle cx="-64" cy="24" r="9" fill="#8f0d17" opacity=".9"/>
  </g>

  <!-- emergency light flare, top left -->
  <g>
    <ellipse cx="240" cy="150" rx="150" ry="90" fill="#c1121f" opacity=".18" filter="url(#s4soft)"/>
    <rect x="196" y="118" width="88" height="44" rx="8" fill="#c1121f" opacity=".8"/>
    <rect x="208" y="130" width="64" height="20" rx="6" fill="#ff8a92" opacity=".9"/>
  </g>

  <rect width="1600" height="900" filter="url(#s4noise)" opacity=".1"/>
  <rect width="1600" height="900" fill="url(#s4vig)"/>
  <text x="1560" y="866" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="3" fill="#a39d94" opacity=".65">PLACEHOLDER 1600×900 · screenshot-04-stalk</text>
</svg>
