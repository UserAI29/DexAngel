<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Placeholder key art: a decaying apartment corridor with amber ceiling lamps, light shafts from tall windows, and a dark silhouette standing in a doorway at the far end.">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171112"/>
      <stop offset=".55" stop-color="#0b0708"/>
      <stop offset="1" stop-color="#060405"/>
    </linearGradient>
    <radialGradient id="hglow" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#ffb703" stop-opacity=".26"/>
      <stop offset=".55" stop-color="#c1121f" stop-opacity=".09"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hshaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb703" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffb703" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hlamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeab5" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffb703" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hvig" cx=".5" cy=".48" r=".74">
      <stop offset=".42" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".92"/>
    </radialGradient>
    <filter id="hnoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="hsoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- shell -->
  <rect width="1920" height="1080" fill="url(#hbg)"/>

  <!-- one-point perspective: back opening, walls, ceiling, floor -->
  <polygon points="0,0 1920,0 1100,470 820,470" fill="#130e0f"/>
  <polygon points="0,1080 1920,1080 1100,700 820,700" fill="#0d0a0a"/>
  <polygon points="0,0 820,470 820,700 0,1080" fill="#0f0b0c"/>
  <polygon points="1920,0 1100,470 1100,700 1920,1080" fill="#0b0809"/>

  <!-- back wall + doorway -->
  <rect x="820" y="470" width="280" height="230" fill="#0a0708"/>
  <rect x="900" y="520" width="130" height="180" fill="#040303"/>
  <rect x="903" y="524" width="5" height="176" fill="#ffb703" opacity=".55"/>
  <ellipse cx="975" cy="700" rx="150" ry="34" fill="#ffb703" opacity=".07" filter="url(#hsoft)"/>

  <!-- something standing in the doorway -->
  <g>
    <path d="M966 545c0-14 8-24 20-24s20 10 20 24-8 22-20 22-20-8-20-22z" fill="#050303"/>
    <path d="M946 700c0-70 12-112 40-118 28 6 40 48 40 118z" fill="#050303"/>
    <path d="M986 566v134" stroke="#ffb703" stroke-opacity=".35" stroke-width="3"/>
    <path d="M946 700c4-64 16-104 38-114" fill="none" stroke="#ffb703" stroke-opacity=".28" stroke-width="3"/>
  </g>

  <!-- tall windows, left wall -->
  <g>
    <polygon points="40,150 350,240 350,565 40,730" fill="#ffb703" opacity=".1"/>
    <polygon points="40,150 350,240 350,565 40,730" fill="none" stroke="#0a0708" stroke-width="14"/>
    <path d="M195 195v510M40 440l310 10" stroke="#0a0708" stroke-width="12"/>
    <polygon points="430,305 645,358 645,565 430,635" fill="#ffb703" opacity=".08"/>
    <polygon points="430,305 645,358 645,565 430,635" fill="none" stroke="#0a0708" stroke-width="10"/>
    <path d="M537 331v280M430 470l215 8" stroke="#0a0708" stroke-width="8"/>
  </g>

  <!-- light shafts on the floor -->
  <polygon points="40,730 350,565 760,1080 300,1080" fill="url(#hshaft)"/>
  <polygon points="430,635 645,565 900,1080 640,1080" fill="url(#hshaft)" opacity=".7"/>

  <!-- ceiling lamps receding -->
  <g>
    <polygon points="660,70 1260,70 1180,175 740,175" fill="url(#hlamp)" opacity=".8"/>
    <ellipse cx="960" cy="180" rx="360" ry="70" fill="#ffb703" opacity=".1" filter="url(#hsoft)"/>
    <polygon points="835,265 1085,265 1055,330 865,330" fill="url(#hlamp)" opacity=".6"/>
    <polygon points="910,385 1010,385 998,425 922,425" fill="url(#hlamp)" opacity=".4"/>
  </g>

  <!-- floor drag-mark -->
  <path d="M540 1040 C 720 985, 880 915, 1010 830 L 1055 855 C 920 950, 740 1035, 570 1080 Z" fill="#c1121f" opacity=".3"/>
  <path d="M620 1050 C 780 1000, 910 940, 1015 872 L 1032 886 C 925 962, 780 1030, 645 1072 Z" fill="#8f0d17" opacity=".5"/>

  <!-- debris -->
  <g fill="#e8e2d9" opacity=".5">
    <path d="M1350 980c14-24 38-32 54-26-8 22-30 34-54 26z"/>
    <path d="M1420 930c12-20 32-27 46-22-7 19-25 29-46 22z"/>
    <path d="M420 1010c13-21 34-28 48-23-7 20-27 31-48 23z"/>
  </g>

  <!-- grade -->
  <rect width="1920" height="1080" fill="url(#hglow)"/>
  <rect width="1920" height="1080" filter="url(#hnoise)" opacity=".1"/>
  <rect width="1920" height="1080" fill="url(#hvig)"/>
  <text x="1876" y="1042" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="4" fill="#a39d94" opacity=".6">PLACEHOLDER 1920×1080 · /assets/placeholder-hero.svg</text>
</svg>
